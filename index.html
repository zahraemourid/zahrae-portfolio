<style>
/* VOICE: cinematic, calm, real — a film dolly shot down Moroccan streets

   PICTURE: physically lit Three.js world (sky, PBR plaster, stone, zellige, fabric)
   COLOUR and TYPE: cream white + cedar brown, gold accent; Cormorant Garamond titles, DM Sans text
   LAYOUT: fixed stage, chapter bar on top, story card + skill bag + outfit dock */
:root{--cream:#FBF6EE;--paper:#FFFDF9;--brown:#4E2E1A;--cedar:#7A4A2A;--caramel:#A86E3C;--gold:#C9A24A;--ink:#24160C;--line:rgba(122,74,42,.16)}

html,body{margin:0;background:#1d140d;color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif;overflow-x:clip}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
#track{position:relative;z-index:1;width:1px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--gold);z-index:40}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px max(14px,3vw);z-index:30;pointer-events:none}
.brand{pointer-events:auto;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--brown);color:#fff;font:600 21px 'Cormorant Garamond',serif;border:0;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.chapters{pointer-events:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:rgba(255,253,249,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:4px;box-shadow:0 8px 24px -14px rgba(0,0,0,.5)}
.chapters::-webkit-scrollbar{display:none}
.chapters button{flex:none;border:0;background:none;color:var(--cedar);font-weight:500;font-size:14px;height:38px;padding:0 13px;border-radius:999px;transition:background .25s,color .25s}
.chapters button.on{background:var(--brown);color:#fff}
.hero{position:fixed;left:max(14px,4vw);top:clamp(86px,15vh,170px);z-index:15;max-width:min(540px,calc(100vw - 28px));pointer-events:none;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.hero h1{font:600 clamp(56px,8.5vw,118px)/.9 'Cormorant Garamond',serif;margin:0;letter-spacing:-.01em}

.scrim{position:fixed;inset:0;z-index:14;pointer-events:none;background:linear-gradient(90deg,rgba(20,12,6,.55),rgba(20,12,6,.15) 45%,rgba(20,12,6,0) 65%)}
.hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-weight:500;font-size:14px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.hint i{width:24px;height:38px;border:2px solid #fff;border-radius:14px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}80%{opacity:0;transform:translateY(12px)}100%{opacity:0}}
.card{position:fixed;left:max(16px,4vw);top:92px;width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 190px);overflow:auto;background:rgba(255,253,249,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:22px 24px 20px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);z-index:15;visibility:hidden;opacity:0}
.yr{margin:0;font-weight:700;font-size:13px;color:var(--caramel);display:flex;align-items:center;gap:8px}
.card h2,.sheet h2{font:600 clamp(30px,3.4vw,42px)/1.02 'Cormorant Garamond',serif;margin:6px 0 4px;color:var(--brown);text-wrap:balance}
.pl{margin:0;color:var(--cedar);font-size:15px}
.tx{margin:12px 0 0;font-size:16px}

.bag{height:52px;font-weight:500}

.play .pi{width:40px;height:40px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.skillsTop{pointer-events:auto;flex:none;height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--gold);color:var(--brown);font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.chip.got{background:var(--brown);color:#fff}
.skillgrid h3{display:flex;justify-content:space-between}
.skillgrid h3 span{color:var(--cedar);font-weight:500}

.sheet{background:var(--paper);border-radius:24px;width:min(600px,100%);max-height:86vh;overflow:auto;padding:26px 26px 22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.sheet.bare{background:none;box-shadow:none;padding:0;width:min(860px,100%);overflow:visible}

.chapters{flex:1 1 0;min-width:0;max-width:max-content}
.cvTop{pointer-events:auto;flex:none;height:46px;padding:0 16px;display:flex;align-items:center;gap:6px;border-radius:999px;border:2px solid var(--gold);background:rgba(255,253,249,.92);color:var(--brown);font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.cvpaper{background:#fff;color:#2a1a10;border-radius:6px;padding:clamp(18px,4vw,40px);box-shadow:0 2px 0 rgba(0,0,0,.04);font-size:15px}
.cvpaper h2{font:700 clamp(28px,4vw,38px)/1 'Cormorant Garamond',serif;letter-spacing:.06em;margin:0;color:#2a1a10}

.cvpaper .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;border-top:1px solid #d9cbb9;border-bottom:1px solid #d9cbb9;padding:8px 0;margin-bottom:6px}
.cvpaper .meta a{color:var(--brown);overflow-wrap:anywhere}
.cvpaper h4{margin:16px 0 6px;font-size:13px;letter-spacing:.06em;color:var(--caramel);text-transform:none;border-bottom:1px solid #eee2d4;padding-bottom:4px}
.cvpaper ul{margin:4px 0 0;padding-left:18px}.cvpaper li{margin:2px 0}

.cvpaper .row b{color:#2a1a10}.cvpaper .row span{color:#6b4a36;font-size:14px}
.cvbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.cvbar a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--brown);color:#fff;font-weight:500;text-decoration:none}
@media (max-width:560px){.cvpaper .row{grid-template-columns:minmax(0,1fr)}}
.lap{width:min(860px,100%)}
.lap .scr{background:#1b1714;border-radius:18px 18px 6px 6px;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.lap .win{background:var(--paper);border-radius:8px;overflow:hidden;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);height:min(56vh,520px)}
.lap .bar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:10px 14px;background:#efe5da;font-size:13px;color:var(--cedar)}
.lap .bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lap .bar span{margin-left:10px;font-weight:500}
.lap .side{overflow:auto;border-right:1px solid var(--line);padding:8px}
.lap .side button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;min-height:44px;color:var(--brown);font-weight:500;font-size:14px}
.lap .side button.on{background:var(--brown);color:#fff}
.lap .pane{overflow:auto;padding:18px 22px}
.lap .pane h2{font:600 30px/1.05 'Cormorant Garamond',serif;margin:2px 0 6px;color:var(--brown)}
.lap .pane .k{color:var(--caramel);font-size:14px;font-weight:500}
.lap .pane ul{padding-left:18px}
.lap .base{height:18px;margin:0 -4%;background:linear-gradient(#d9cfc6,#b8ada3);border-radius:0 0 14px 14px;position:relative}
.lap .base::after{content:"";position:absolute;left:50%;top:0;width:16%;height:7px;transform:translateX(-50%);background:#a99e94;border-radius:0 0 8px 8px}

@media (max-width:700px){.lap .win{grid-template-columns:minmax(0,1fr);height:min(72vh,640px)}.lap .side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.lap .side button{flex:none;width:auto;white-space:nowrap}.lap .bar{grid-column:1}}
.back{margin-top:22px;height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--brown);background:none;color:var(--brown);font-weight:500}
.loader{position:fixed;inset:0;z-index:60;background:#1d140d;display:grid;place-items:center;text-align:center;color:#F3E6D3}
.loader p{font:600 32px 'Cormorant Garamond',serif;margin:18px 0 10px}
.loader small{display:block;color:#C9A24A;font-size:14px;margin-top:10px}
.loader .bar{width:220px;height:3px;border-radius:2px;background:#3a2a1c;overflow:hidden;margin:auto}
.loader .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:35;background:var(--brown);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none}

  .card{top:auto;bottom:84px;max-height:40vh;padding:16px 18px;border-radius:18px}

}

}

</style>
